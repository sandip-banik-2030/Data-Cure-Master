{% extends "base.html" %}
{% block title %}Register — Datacure{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">⚡</span>
      <span class="auth-logo-text">Datacure</span>
    </div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Start earning coins today</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="reg-form">
      <div class="form-group">
        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="user_id"
               placeholder="Letters, numbers, _ . - (min 3)"
               minlength="3" maxlength="30" autocomplete="username"
               autocorrect="off" autocapitalize="none" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Min 6 characters" minlength="6"
                 autocomplete="new-password" required />
          <button type="button" class="input-eye" onclick="togglePwd('password', this)">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="reg-btn">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
