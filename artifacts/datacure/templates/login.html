{% extends "base.html" %}
{% block title %}Login — Datacure{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">⚡</span>
      <span class="auth-logo-text">Datacure</span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your account</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrap">
          <span class="input-prefix">+91</span>
          <input type="tel" id="phone" name="phone" maxlength="10"
                 pattern="[0-9]{10}" placeholder="10-digit number"
                 inputmode="numeric" autocomplete="tel-national" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Your password" autocomplete="current-password" required />
          <button type="button" class="input-eye" onclick="togglePwd('password', this)">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
